spring.application.name=DriveEasy Vehicle Rental

# Web server
# Uses 8081 unless a PORT environment variable is set
# (8080 is often taken by a separately installed Tomcat server)
server.port=${PORT:8081}
server.servlet.session.timeout=60m
# Keep the session ID in a cookie only (never in the URL)
server.servlet.session.tracking-modes=cookie

# JSP views live in src/main/webapp/WEB-INF/jsp
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Folder that holds the .txt data files (relative to the project folder)
app.data-dir=data

# Show our own error page instead of the default one
server.error.whitelabel.enabled=false
server.error.include-message=always
